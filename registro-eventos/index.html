<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Eventos" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Registro rápido de eventos con fecha y hora." />
  <title>Registro de eventos</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <header class="cabecera">
      <h1 id="titulo" class="cabecera-titulo">Registro</h1>
    </header>

    <div id="aviso-persistencia" class="aviso-banner" hidden role="status">
      Este navegador no permite guardar datos. Los registros se perderán al cerrar la app.
    </div>

    <main id="vista" class="vista"></main>
  </div>

  <nav class="barra" aria-label="Navegación principal">
    <a href="#/registro" data-ruta="registro">
      <span class="barra-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      </span>
      <span>Registro</span>
    </a>
    <a href="#/dashboard" data-ruta="dashboard">
      <span class="barra-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      </span>
      <span>Dashboard</span>
    </a>
    <a href="#/historial" data-ruta="historial">
      <span class="barra-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
      </span>
      <span>Historial</span>
    </a>
  </nav>

  <div id="capa-avisos" class="capa-avisos" aria-live="polite"></div>
  <div id="capa-dialogo"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
